<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tile RPG</title>
  <script src="game.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a2e; color: white; font-family: sans-serif; }
    .hidden { display: none !important; }
    #start-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #1a1a2e; z-index: 100; }
    .start-content { text-align: center; }
    h1 { font-size: 3rem; margin-bottom: 2rem; color: #4ecdc4; }
    button { padding: 10px 20px; font-size: 1.2rem; cursor: pointer; background: #4ecdc4; color: #1a1a2e; border: none; border-radius: 5px; margin: 0 10px; font-weight: bold; }
    button:disabled { background: #333; color: #777; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #6ff; }
    #game-canvas { display: block; outline: none; }
  </style>
</head>
<body>
  <div id="app">
    <!-- Start screen -->
    <div id="start-screen" class="screen" role="main">
      <div class="start-content">
        <h1>Tile RPG</h1>
        <div class="start-buttons">
          <button id="btn-new-game" class="btn-primary" aria-label="Start New Game">New Game</button>
          <button id="btn-continue" class="btn-primary" aria-label="Continue Game" disabled>Continue</button>
        </div>
      </div>
    </div>

    <!-- Game screen -->
    <div id="game-screen" class="screen hidden" role="main">
      <canvas id="game-canvas" tabindex="0" aria-label="Game canvas"></canvas>
      <div id="error-panel" class="error-panel hidden" role="alert"></div>
    </div>
  </div>

</body>
</html>
